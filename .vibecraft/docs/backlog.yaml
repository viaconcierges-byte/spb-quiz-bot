    description: >-
      Улучшить кнопку «Поделиться викториной» в квиз-боте «Код Петербурга».


      Сейчас кнопка просто копирует ссылку на квиз в буфер обмена. Нужно сделать
      удобный шаринг для распространения квиза.


      Механика:

      1. При нажатии кнопки «Поделиться викториной» сначала пробовать нативный
      Web Share API (navigator.share) с ссылкой на квиз и текстом. Если доступен
      — открывается системный выбор приложения/мессенджера.

      2. Если Web Share недоступен (частый случай в Telegram Web App, особенно
      десктоп) — открывать аккуратное модальное окно со списком мессенджеров:
      Telegram, WhatsApp, VK, Viber, Одноклассники (иконки-кружки в сетке по 2–3
      в ряд). По нажатию на мессенджер открывается соответствующая share-ссылка
      с уже вставленным URL квиза. Внизу окна отдельная кнопка «Скопировать
      ссылку».

      3. Использовать стандартные share-URL: t.me/share/url?url=...,
      wa.me/?text=..., vk.com/share.php?url=..., viber://forward?text=...,
      ok.ru/dk?st.cmd=addShare&st._surl=...

      4. Ссылка должна быть на сам квиз (текущий URL приложения). Подтверждение
      копирования — через sonner toast.


      Оформить аккуратно и красиво в стиле проекта, использовать lucide-react
      иконки и shadcn/ui (Dialog, Button). Не ломать остальной функционал: две
      кнопки на итоговом экране («Поделиться викториной» и «Вернуться к темам»),
      результат со смайликом, промокод, блок контактов, PostHog.
